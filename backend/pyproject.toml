[project]
name = "nagarlens-backend"
version = "0.3.0"
description = "NAGARLENS Infrastructure Intelligence Network — Backend Foundation"
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = { text = "Proprietary" }
authors = [
    { name = "NAGARLENS Core Engineering Team" }
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "geoalchemy2==0.16.0",
    "alembic==1.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
